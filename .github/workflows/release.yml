# Baut die Anwendung für macOS und Windows und veröffentlicht sie als Release.
#
# Ausgelöst durch einen Versions-Tag:
#
#   npm run version:set 0.2.0
#   git commit -am "Version 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# tauri-action legt neben den Installern eine `latest.json` ab - genau die
# Datei, die die Anwendung beim Klick auf „Nach Updates suchen" liest.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal-Paket: läuft auf Apple Silicon und Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Holt zusätzlich das MediaPipe-Modell und die WASM-Laufzeit (postinstall).
      - run: npm ci

      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # Der Schlüssel ist eine einzige Base64-Zeile ohne Zeilenumbruch. Beim
      # Kopieren aus einem Terminal hängt sich leicht ein Fremdzeichen an - zsh
      # zeigt am Ende einer Ausgabe ohne Umbruch ein „%" an, das mitkopiert wird.
      # Alles, was nicht zum Base64-Alphabet gehört, fliegt deshalb raus.
      - name: Signaturschlüssel aufbereiten
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          KEY=$(printf '%s' "$RAW_KEY" | tr -cd 'A-Za-z0-9+/=')
          if [ ${#KEY} -lt 100 ]; then
            echo "Secret TAURI_SIGNING_PRIVATE_KEY fehlt oder ist unvollständig (${#KEY} Zeichen)." >&2
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ausdrücklich leer, wenn kein Passwort hinterlegt ist - sonst fragt
          # der Signierer interaktiv nach und der Lauf bleibt hängen.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # Kein Block für die Apple-Signatur: Eine gesetzte, aber leere Variable
          # bringt Tauri dazu, ein leeres Zertifikat importieren zu wollen - der
          # Bau bricht dann mit „failed to import keychain certificate" ab.
          # Sobald eine Developer ID vorliegt, den Block aus docs/release.md
          # hier einsetzen.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gesture TimeTrack ${{ github.ref_name }}'
          # Dieser Text erscheint auch in der Anwendung, wenn sie ein Update
          # anbietet - deshalb kein leeres Feld hinterlassen.
          releaseBody: |
            Installation: `.dmg` für macOS (Apple Silicon und Intel),
            `.msi` oder `-setup.exe` für Windows.

            Bestehende Installationen finden dieses Update über
            *Einstellungen → Aktualisierung → Nach Updates suchen*.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

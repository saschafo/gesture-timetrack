# Baut die Anwendung für macOS und Windows und veröffentlicht sie als Release.
#
# Ausgelöst durch einen Versions-Tag:
#
#   npm run version:set 0.2.0
#   git commit -am "Version 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# tauri-action legt neben den Installern eine `latest.json` ab - genau die
# Datei, die die Anwendung beim Klick auf „Nach Updates suchen" liest.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal-Paket: läuft auf Apple Silicon und Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Holt zusätzlich das MediaPipe-Modell und die WASM-Laufzeit (postinstall).
      - run: npm ci

      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signatur der Update-Pakete. Ohne sie lehnt die Anwendung ein Update ab.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signatur und Notarisierung für macOS - ohne diese Werte wird ohne
          # Signatur gebaut, und Gatekeeper warnt beim ersten Start.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gesture TimeTrack ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

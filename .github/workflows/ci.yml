# Prüft jeden Push und jede Pull-Request: Typen, Frontend-Tests, Rust-Tests.
#
# Läuft auf Linux, weil dort die Rechenzeit am günstigsten ist - die Testsuiten
# selbst sind plattformunabhängig. Die eigentlichen Pakete entstehen erst beim
# Release auf macOS und Windows (siehe release.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Systembibliotheken, die das Tauri-Backend zum Übersetzen braucht.
      - name: Systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typen prüfen
        run: npx vue-tsc --noEmit

      - name: Frontend-Tests
        run: npm test

      - name: Rust-Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
